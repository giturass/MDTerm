name: Dependency graph

on:
  push:
    branches: [ 'master' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout sources
      uses: actions/checkout@v6
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 17
    - name: Generate dependency graph
      uses: gradle/actions/dependency-submission@v6
      with:
        # GitHub does not enable the dependency graph automatically for new forks.
        dependency-graph: ${{ github.repository == 'termux/termux-app' && 'generate-submit-and-upload' || 'generate-and-upload' }}
