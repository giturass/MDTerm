name: Unit tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TERMUX_PACKAGE_VARIANT: apt-android-7
  TERMUX_APP_ABIS: arm64-v8a

jobs:
  testing:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0 ndk;29.0.14206865'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Execute tests
        run: ./gradlew --no-daemon testDebugUnitTest
