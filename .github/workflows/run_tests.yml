name: Unit tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TERMUX_PACKAGE_VARIANT: apt-android-7
  TERMUX_APP_ABIS: arm64-v8a
  GHOSTTY_BUILD_JOBS: '2'

jobs:
  testing:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
      - name: Test native source preparation
        env:
          TMPDIR: ${{ runner.temp }}
        run: bash scripts/tests/test-prepare-native-sources.sh
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0 ndk;29.0.14206865 cmake;3.22.1'
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: '0.16.0'
      - name: Cache pinned native dependencies
        uses: actions/cache@v5
        with:
          path: |
            build/native-sources
            build/zig-cache
          key: ghostty-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.gradle', 'gradle.properties', 'native/patches/**', 'scripts/*.sh') }}
      - name: Check terminfo compiler
        run: command -v tic
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Execute tests
        run: ./gradlew --no-daemon --max-workers=2 testDebugUnitTest
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-reports
          if-no-files-found: warn
          path: |
            **/build/reports/tests/
            **/build/test-results/

  native:
    name: Ghostty core, native helpers and Android Vulkan JNI
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0 ndk;29.0.14206865 cmake;3.22.1'
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: '0.16.0'
      - name: Cache pinned native dependencies
        uses: actions/cache@v5
        with:
          path: |
            build/native-sources
            build/zig-cache
          key: ghostty-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.gradle', 'gradle.properties', 'native/patches/**', 'scripts/*.sh') }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Compile Android JNI and run native terminal tests
        run: |
          ./gradlew --no-daemon --max-workers=2 \
            :terminal-emulator:externalNativeBuildDebug \
            :terminal-emulator:testGhosttyNative
      - name: Build and run native font fitting and progress tests
        run: |
          cmake -S terminal-emulator/src/test/native \
            -B terminal-emulator/build/native-font-tests \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build terminal-emulator/build/native-font-tests \
            --parallel "$GHOSTTY_BUILD_JOBS"
          ctest --test-dir terminal-emulator/build/native-font-tests \
            --output-on-failure --no-tests=error
      - name: Verify JNI exports, Vulkan dependency and 16 KiB pages
        run: |
          shopt -s nullglob globstar
          libraries=(terminal-emulator/build/intermediates/cxx/Debug/**/arm64-v8a/libtermux.so)
          test "${#libraries[@]}" -gt 0
          python3 scripts/verify-ghostty-binary.py \
            --ndk "$ANDROID_HOME/ndk/29.0.14206865" "${libraries[@]}"
      - name: Upload native build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ghostty-native-diagnostics
          if-no-files-found: warn
          path: |
            terminal-emulator/build/intermediates/cxx/**/logs/
            terminal-emulator/build/native-font-tests/Testing/
