name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TERMUX_PACKAGE_VARIANT: apt-android-7
  TERMUX_APP_ABIS: arm64-v8a
  TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS: '1'

jobs:
  build:
    name: Android 12+ arm64-v8a APK
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0 ndk;29.0.14206865'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build signed arm64-v8a APK
        env:
          BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          version="$(sed -n 's/^ *versionName "\([^"]*\)"$/\1/p' app/build.gradle)"
          export TERMUX_APP_VERSION_NAME="$version+${BUILD_SHA:0:7}"
          export TERMUX_APK_VERSION_TAG="v${TERMUX_APP_VERSION_NAME}-${TERMUX_PACKAGE_VARIANT}-github-debug"
          ./gradlew --no-daemon :app:assembleDebug

          apk_dir=app/build/outputs/apk/debug
          apk_name="mdterm_${TERMUX_APK_VERSION_TAG}_arm64-v8a.apk"
          test -f "$apk_dir/$apk_name"
          test "$(find "$apk_dir" -maxdepth 1 -name '*.apk' | wc -l)" -eq 1
          test "$(unzip -Z1 "$apk_dir/$apk_name" | awk -F/ '$1 == "lib" && NF == 3 { print $2 }' | sort -u)" = arm64-v8a
          test "$(apkanalyzer manifest min-sdk "$apk_dir/$apk_name")" -ge 31
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk_dir/$apk_name"
          (cd "$apk_dir" && sha256sum "$apk_name" > "${apk_name%.apk}_sha256sums")
          echo "APK_ARTIFACT_NAME=${apk_name%.apk}" >> "$GITHUB_ENV"

      - name: Upload APK and SHA-256 checksum
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APK_ARTIFACT_NAME }}
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*_arm64-v8a.apk
            app/build/outputs/apk/debug/*_arm64-v8a_sha256sums
