name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      apk_name:
        description: 'Optional APK filename (including .apk)'
        required: false
        type: string
      release_tag:
        description: 'Publish to this Release tag; leave empty for artifacts only. Existing tags rebuild their tagged commit.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  TERMUX_PACKAGE_VARIANT: apt-android-7
  TERMUX_APP_ABIS: arm64-v8a
  TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS: '1'

jobs:
  release:
    name: Signed Android 12+ arm64-v8a release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Resolve release source
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          release_tag="$REQUESTED_RELEASE_TAG"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release_tag="$GITHUB_REF_NAME"
          fi
          if [[ -n "$release_tag" ]]; then
            [[ "$release_tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
            git check-ref-format "refs/tags/$release_tag"
            remote_tag="$(git ls-remote --tags origin "refs/tags/$release_tag")"
            if [[ -n "$remote_tag" ]]; then
              git fetch --no-tags origin "refs/tags/$release_tag"
              git checkout --detach FETCH_HEAD
            fi
          fi
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0 ndk;29.0.14206865'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MDTERM_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mdterm-release.p12"

      - name: Test and build release APK
        env:
          REQUESTED_APK_NAME: ${{ inputs.apk_name }}
          MDTERM_RELEASE_STORE_FILE: ${{ runner.temp }}/mdterm-release.p12
          MDTERM_RELEASE_STORE_PASSWORD: ${{ secrets.MDTERM_RELEASE_STORE_PASSWORD }}
          MDTERM_RELEASE_KEY_ALIAS: ${{ secrets.MDTERM_RELEASE_KEY_ALIAS }}
          MDTERM_RELEASE_KEY_PASSWORD: ${{ secrets.MDTERM_RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -n "$REQUESTED_APK_NAME" && ! "$REQUESTED_APK_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*\.apk$ ]]; then
            echo 'APK filename must contain only letters, digits, dots, underscores or hyphens and end in .apk' >&2
            exit 1
          fi
          test -n "$MDTERM_RELEASE_STORE_PASSWORD"
          test -n "$MDTERM_RELEASE_KEY_ALIAS"
          test -n "$MDTERM_RELEASE_KEY_PASSWORD"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export TERMUX_APP_VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^ *versionName "\([^"]*\)"$/\1/p' app/build.gradle)"
            export TERMUX_APP_VERSION_NAME="$version+${SOURCE_SHA:0:7}"
          fi
          export TERMUX_APK_VERSION_TAG="v${TERMUX_APP_VERSION_NAME}-${TERMUX_PACKAGE_VARIANT}-github-release"
          ./gradlew --no-daemon testDebugUnitTest :app:assembleRelease
          built_apk="mdterm_${TERMUX_APK_VERSION_TAG}_arm64-v8a.apk"
          apk_name="${REQUESTED_APK_NAME:-$built_apk}"
          if [[ "$apk_name" != "$built_apk" ]]; then
            mv "app/build/outputs/apk/release/$built_apk" "app/build/outputs/apk/release/$apk_name"
          fi
          echo "APK_NAME=$apk_name" >> "$GITHUB_ENV"

      - name: Verify APK and generate checksum
        run: |
          apk_dir=app/build/outputs/apk/release
          apk="$apk_dir/$APK_NAME"
          test -f "$apk"
          test "$(find "$apk_dir" -maxdepth 1 -name '*.apk' | wc -l)" -eq 1
          test "$(apkanalyzer manifest application-id "$apk")" = com.termux
          test "$(apkanalyzer manifest min-sdk "$apk")" -ge 31
          test "$(apkanalyzer manifest debuggable "$apk")" = false
          test "$(unzip -Z1 "$apk" | awk -F/ '$1 == "lib" && NF == 3 { print $2 }' | sort -u)" = arm64-v8a
          if unzip -Z1 "$apk" | grep -E 'libmdterm-|libtalloc|libandroid-shmem|assets/mdterm-runtime/'; then
            echo 'Unexpected coexistence runtime in APK' >&2
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          (cd "$apk_dir" && sha256sum "$APK_NAME" > "${APK_NAME%.apk}_sha256sums")

      - name: Upload release APK and checksum
        uses: actions/upload-artifact@v6
        with:
          name: mdterm-release-${{ github.sha }}
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*_sha256sums

      - name: Publish GitHub Release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/mdterm-release-notes.md"
          cp docs/release-notes.md "$notes"
          printf '\n\nBuilt and published by [GitHub Actions](%s/%s/actions/runs/%s).\nSource commit: `%s`.\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$SOURCE_SHA" >> "$notes"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "app/build/outputs/apk/release/$APK_NAME" \
              "app/build/outputs/apk/release/${APK_NAME%.apk}_sha256sums" \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" --latest --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" \
              "app/build/outputs/apk/release/$APK_NAME" \
              "app/build/outputs/apk/release/${APK_NAME%.apk}_sha256sums" \
              --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
              --title "$RELEASE_TAG" --latest --notes-file "$notes"
          fi

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/mdterm-release.p12"
